<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">

</head>
<body>
<div class="main-box">
	<header class="top_header">
		<article class="header_left">
			<label for="cal_date">달력</label><br>
			<input id="cal_date" type="date" min="2020-01-01" max="2030-12-31">
		</article>
		<section class="header_middle">
			<main>To do List</main>
			<h1>오늘의 할 일</h1>
			<p></p>
			<input id="insertList" type="text" placeholder="할 일을 입력하세요"/> <button id="btn_add">추가</button>
		</section>
		<article class="header_right">
			<button id="btn_change"></button>
			<p id="today_date"></p>
		</article>
	</header>
	<hr>
	<h3 id="h3_style" style="font-size: 1.8em;">CHECK_LIST</h3>
	<ul id="myList">
		<li id="no_list">아직 할 일이 없습니다.</li>
	</ul>
	<hr>
	<footer>
		<article class="bottom_meter">
			<meter id="todo_meter" min="0" max="1" value="0">목표달성률</meter>
			<span id="meter_text">0 / 0</span>
		</article>
		<article class="bottom_btn">
			<button id="btn_alldel" class="btn_alldel hide">전체 삭제</button>
			<button id="btn_save">저장</button>
			<button id="btn_edit">수정</button>
		</article>
	</footer>
</div>
</body>
<script src="./js/script.js"/></script>
</html>
